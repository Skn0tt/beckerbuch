<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Banana Bread</title>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Recipe",
        "name": "Banana Bread",
        "recipeYield": "1 loaf",
        "image": "https://www.loveandlemons.com/images/banana-bread.jpg",
        "url": "https://www.loveandlemons.com/banana-bread/",
        "recipeIngredient": [
          "3 ripe bananas mashed",
          "75 g unsalted butter melted",
          "150 g sugar",
          "1 large egg",
          "1 tsp vanilla extract",
          "190 g all-purpose flour",
          "1 tsp baking soda",
          "0.5 tsp salt"
        ],
        "recipeInstructions": [
          "Mash the bananas and mix in the melted butter, sugar, egg, and vanilla.",
          "Fold in the flour, baking soda, and salt.",
          "Bake until a skewer comes out clean. canned-fixture-love-and-lemons"
        ]
      }
    </script>
  </head>
  <body>
    <h1>Banana Bread</h1>
  </body>
</html>
