<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sieve</title>
    <style>
      :root {
        --bg: #f7f8fa;
        --panel: #ffffff;
        --border: #e4e7ec;
        --text: #2a3340;
        --muted: #8b95a5;
        --accent: #5a7d6c;
        --stale: #b07a7a;
        --pending: #d0d5dd;
        --status-queued: #c5cad3;
        --status-running: #c4a35a;
        --mono: "SF Mono", "Menlo", "Consolas", monospace;
        --sans: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;

        /* shard bands — pastel fills, clear hue edges (readable, not loud) */
        --s0: #d9ebf7;
        --s0-edge: #3d7eb0;
        --s1: #d8f0e2;
        --s1-edge: #2f8a5b;
        --s2: #f5e6c8;
        --s2-edge: #b07a18;
        --s3: #e2e0f4;
        --s3-edge: #6a5fad;
        --s4: #f3d9d4;
        --s4-edge: #b05a4a;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: var(--sans);
      }

      body {
        display: grid;
        grid-template-rows: auto 1fr;
        min-height: 100%;
      }

      header {
        display: flex;
        align-items: baseline;
        gap: 0.75rem;
        padding: 0.75rem 1rem;
        border-bottom: 1px solid var(--border);
        background: var(--panel);
      }

      header h1 {
        margin: 0;
        font-size: 1rem;
        font-weight: 600;
      }

      header .repo {
        color: var(--muted);
        font-family: var(--mono);
        font-size: 0.78rem;
      }

      .shell {
        display: grid;
        grid-template-columns: 1fr 240px;
        min-height: 0;
      }

      main {
        display: grid;
        grid-template-rows: auto 1fr;
        min-height: 0;
        border-right: 1px solid var(--border);
      }

      .controls {
        display: grid;
        grid-template-columns: 1fr 1fr auto;
        gap: 1rem;
        align-items: end;
        padding: 0.85rem 1rem;
        background: var(--panel);
        border-bottom: 1px solid var(--border);
      }

      .knob label {
        display: flex;
        justify-content: space-between;
        font-size: 0.82rem;
        margin-bottom: 0.3rem;
      }

      .knob label span:last-child {
        font-family: var(--mono);
        color: var(--muted);
        font-weight: 500;
      }

      .knob input[type="range"] {
        width: 100%;
        accent-color: var(--accent);
      }

      button.run {
        appearance: none;
        border: 1px solid var(--accent);
        background: var(--accent);
        color: #fff;
        font-weight: 550;
        font-size: 0.85rem;
        padding: 0.5rem 0.95rem;
        border-radius: 6px;
        cursor: pointer;
        min-width: 80px;
      }

      button.run:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }

      .tests {
        min-height: 0;
        padding: 0.75rem 1rem 1rem;
        display: flex;
        flex-direction: column;
      }

      .test-list {
        list-style: none;
        margin: 0;
        padding: 0;
        overflow: auto;
        flex: 1;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 8px;
        font-family: var(--mono);
        font-size: 0.78rem;
      }

      .test-list li {
        display: grid;
        grid-template-columns: 14px 1fr auto;
        gap: 0.55rem;
        align-items: center;
        padding: 0.38rem 0.7rem;
        border-bottom: 1px solid rgba(0, 0, 0, 0.04);
        border-left: 3px solid transparent;
      }

      .test-list li:last-child {
        border-bottom: 0;
      }

      .test-list li.beyond {
        opacity: 0.42;
        background: transparent !important;
        border-left-color: transparent !important;
      }

      .test-list .dur {
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }

      .icon {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        display: inline-block;
        border: 1.5px solid var(--status-queued);
        background: transparent;
      }

      .icon.queued {
        border-color: var(--status-queued);
        background: transparent;
      }

      .icon.running {
        border-color: var(--status-running);
        border-top-color: transparent;
        background: transparent;
        animation: spin 0.85s linear infinite;
      }

      .icon.ok {
        border-color: var(--accent);
        background: var(--accent);
        border-radius: 50%;
        animation: none;
      }

      .icon.fail {
        border-color: var(--stale);
        background: var(--stale);
        border-radius: 50%;
        animation: none;
      }

      .icon.skipped {
        border-color: var(--status-queued);
        background: var(--status-queued);
        animation: none;
      }

      .icon.beyond {
        width: 8px;
        height: 1.5px;
        border: 0;
        border-radius: 1px;
        background: var(--pending);
        opacity: 0.85;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      aside.workers {
        padding: 0.75rem;
        background: var(--panel);
        overflow: auto;
      }

      .worker-grid {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }

      .worker {
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 0.55rem 0.6rem;
        background: var(--bg);
        box-shadow: inset 3px 0 0 transparent;
      }

      .worker.stale {
        border-color: var(--border);
        opacity: 0.7;
        box-shadow: inset 2px 0 0 var(--status-queued);
        background: var(--bg);
      }

      .worker.stale .state {
        color: var(--muted);
      }

      .worker .top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 0.4rem;
        margin-bottom: 0.2rem;
      }

      .worker .id-row {
        display: flex;
        align-items: center;
        gap: 0.4rem;
        min-width: 0;
      }

      .worker .id {
        font-family: var(--mono);
        font-size: 0.8rem;
        font-weight: 600;
      }

      .worker .state {
        font-size: 0.65rem;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--muted);
      }

      .worker.stale .state {
        color: var(--stale);
      }

      .worker .job {
        font-size: 0.72rem;
        color: var(--text);
      }

      /* Heartbeat lamp: green within lease policy, red when stale;
         `.pulse` fires once when a new heartbeat arrives. */
      .worker .hb {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        flex-shrink: 0;
        background: var(--stale);
        box-shadow: 0 0 0 0 transparent;
      }

      .worker .hb.ok {
        background: var(--accent);
      }

      .worker .hb.pulse.ok {
        animation: hb-pulse-ok 0.55s ease-out;
      }

      .worker .hb.pulse:not(.ok) {
        animation: hb-pulse-bad 0.55s ease-out;
      }

      @keyframes hb-pulse-ok {
        0% {
          transform: scale(1);
          box-shadow: 0 0 0 0 rgba(90, 125, 108, 0.4);
        }
        40% {
          transform: scale(1.55);
          box-shadow: 0 0 0 6px rgba(90, 125, 108, 0);
        }
        100% {
          transform: scale(1);
          box-shadow: 0 0 0 0 transparent;
        }
      }

      @keyframes hb-pulse-bad {
        0% {
          transform: scale(1);
          box-shadow: 0 0 0 0 rgba(176, 122, 122, 0.4);
        }
        40% {
          transform: scale(1.55);
          box-shadow: 0 0 0 6px rgba(176, 122, 122, 0);
        }
        100% {
          transform: scale(1);
          box-shadow: 0 0 0 0 transparent;
        }
      }

      @media (max-width: 900px) {
        .shell {
          grid-template-columns: 1fr;
        }

        main {
          border-right: 0;
        }

        .controls {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Sieve</h1>
      <div class="repo" id="repoLabel">…</div>
    </header>

    <div class="shell">
      <main>
        <div class="controls">
          <div class="knob">
            <label>
              <span>CPU time</span>
              <span id="budgetVal">60s</span>
            </label>
            <input id="budget" type="range" min="5" max="180" value="60" step="5" />
          </div>
          <div class="knob">
            <label>
              <span>Wall time</span>
              <span id="latencyVal">30s</span>
            </label>
            <input id="latency" type="range" min="5" max="120" value="30" step="5" />
          </div>
          <button class="run" id="runBtn" type="button">Run</button>
        </div>

        <div class="tests">
          <ul class="test-list" id="testList"></ul>
        </div>
      </main>

      <aside class="workers">
        <div class="worker-grid" id="workerGrid"></div>
      </aside>
    </div>

    <script src="/app.js?v=affected-only1" type="module"></script>
  </body>
</html>
