<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sieve</title>
    <style>
      :root {
        --bg: #f7f8fa;
        --panel: #ffffff;
        --border: #e4e7ec;
        --text: #2a3340;
        --muted: #8b95a5;
        --accent: #5a7d6c;
        --stale: #b07a7a;
        --pending: #d0d5dd;
        --status-queued: #c5cad3;
        --status-running: #c4a35a;
        --mono: "SF Mono", "Menlo", "Consolas", monospace;
        --sans: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;

        /* shard bands — pastel fills, clear hue edges (readable, not loud) */
        --s0: #d9ebf7;
        --s0-edge: #3d7eb0;
        --s1: #d8f0e2;
        --s1-edge: #2f8a5b;
        --s2: #f5e6c8;
        --s2-edge: #b07a18;
        --s3: #e2e0f4;
        --s3-edge: #6a5fad;
        --s4: #f3d9d4;
        --s4-edge: #b05a4a;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: var(--sans);
      }

      body {
        display: grid;
        grid-template-rows: auto 1fr;
        min-height: 100%;
      }

      header {
        display: flex;
        align-items: baseline;
        gap: 0.75rem;
        padding: 0.75rem 1rem;
        border-bottom: 1px solid var(--border);
        background: var(--panel);
      }

      header h1 {
        margin: 0;
        font-size: 1rem;
        font-weight: 600;
      }

      header .tabs {
        display: flex;
        gap: 0.15rem;
        margin-left: 0.35rem;
      }

      header .tabs button {
        appearance: none;
        border: 0;
        background: transparent;
        color: var(--muted);
        font: inherit;
        font-size: 0.82rem;
        font-weight: 500;
        padding: 0.2rem 0.55rem;
        border-radius: 5px;
        cursor: pointer;
      }

      header .tabs button[aria-selected="true"] {
        color: var(--text);
        background: rgba(0, 0, 0, 0.05);
      }

      header .tabs button:hover {
        color: var(--text);
      }

      header .repo {
        color: var(--muted);
        font-family: var(--mono);
        font-size: 0.78rem;
        margin-left: auto;
      }

      .shell {
        display: grid;
        grid-template-columns: 1fr 240px;
        min-height: 0;
      }

      .shell[hidden],
      .signals-shell[hidden] {
        display: none !important;
      }

      .signals-shell {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.75rem;
        min-height: 0;
        padding: 0.75rem 1rem 1rem;
      }

      .signals-col {
        min-height: 0;
        display: flex;
        flex-direction: column;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 8px;
        overflow: hidden;
      }

      .signals-col h2 {
        margin: 0;
        padding: 0.65rem 0.85rem;
        font-size: 0.82rem;
        font-weight: 600;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        gap: 0.4rem;
      }

      .signals-col h2 .count {
        color: var(--muted);
        font-family: var(--mono);
        font-weight: 500;
        font-size: 0.75rem;
      }

      .signals-col h2 .popular-star,
      .test-list .popular-badge {
        color: #c44b4b;
      }

      .signals-list {
        list-style: none;
        margin: 0;
        padding: 0;
        overflow: auto;
        flex: 1;
        font-family: var(--mono);
        font-size: 0.78rem;
      }

      .signals-list li {
        display: flex;
        flex-direction: column;
        gap: 0.15rem;
        padding: 0.45rem 0.85rem;
        border-bottom: 1px solid rgba(0, 0, 0, 0.04);
        align-items: stretch;
      }

      .signals-list li:last-child {
        border-bottom: 0;
      }

      .signals-list .label {
        line-height: 1.35;
        word-break: break-word;
      }

      .signals-list .meta {
        color: var(--muted);
        font-size: 0.72rem;
        line-height: 1.3;
      }

      .signals-list .empty {
        opacity: 0.55;
        padding: 0.85rem;
      }

      main {
        display: grid;
        grid-template-rows: auto 1fr;
        min-height: 0;
        border-right: 1px solid var(--border);
      }

      .controls {
        display: grid;
        grid-template-columns: 1fr 1fr auto auto auto;
        gap: 1rem;
        align-items: end;
        padding: 0.85rem 1rem;
        background: var(--panel);
        border-bottom: 1px solid var(--border);
      }

      .knob label {
        display: flex;
        justify-content: space-between;
        font-size: 0.82rem;
        margin-bottom: 0.3rem;
      }

      .knob label span:last-child {
        font-family: var(--mono);
        color: var(--muted);
        font-weight: 500;
      }

      .knob input[type="range"] {
        width: 100%;
        accent-color: var(--accent);
      }

      .toggle {
        display: flex;
        align-items: center;
        gap: 0.45rem;
        font-size: 0.82rem;
        color: var(--text);
        user-select: none;
        padding-bottom: 0.35rem;
        white-space: nowrap;
      }

      .toggle input {
        accent-color: var(--accent);
        width: 0.95rem;
        height: 0.95rem;
        margin: 0;
      }

      button.run {
        appearance: none;
        border: 1px solid var(--accent);
        background: var(--accent);
        color: #fff;
        font-weight: 550;
        font-size: 0.85rem;
        padding: 0.5rem 0.95rem;
        border-radius: 6px;
        cursor: pointer;
        min-width: 80px;
      }

      button.run:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }

      .tests {
        min-height: 0;
        padding: 0.75rem 1rem 1rem;
        display: flex;
        flex-direction: column;
      }

      .test-list {
        list-style: none;
        margin: 0;
        padding: 0;
        overflow: auto;
        flex: 1;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 8px;
        font-family: var(--mono);
        font-size: 0.78rem;
      }

      .test-list li {
        display: grid;
        grid-template-columns: 14px 1fr auto 1.25rem 1.25rem;
        gap: 0.55rem;
        align-items: center;
        padding: 0.38rem 0.7rem;
        border-bottom: 1px solid rgba(0, 0, 0, 0.04);
        border-left: 3px solid transparent;
      }

      .test-list li:last-child {
        border-bottom: 0;
      }

      .test-list li.beyond {
        opacity: 0.42;
        background: transparent !important;
        border-left-color: transparent !important;
      }

      .test-list .dur {
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }

      .test-list .flake,
      .test-list .popular-badge {
        font-size: 0.85rem;
        line-height: 1;
        cursor: help;
        opacity: 0.9;
        text-align: center;
        justify-self: end;
      }

      /* Keep the columns so durations stay aligned when there's no badge. */
      .test-list .flake.is-empty,
      .test-list .popular-badge.is-empty {
        visibility: hidden;
        pointer-events: none;
        cursor: default;
      }

      .icon {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        display: inline-block;
        border: 1.5px solid var(--status-queued);
        background: transparent;
      }

      .icon.queued {
        border-color: var(--status-queued);
        background: transparent;
      }

      .icon.running {
        border-color: var(--status-running);
        border-top-color: transparent;
        background: transparent;
        animation: spin 0.85s linear infinite;
      }

      .icon.ok {
        border-color: var(--accent);
        background: var(--accent);
        border-radius: 50%;
        animation: none;
      }

      .icon.fail {
        border-color: var(--stale);
        background: var(--stale);
        border-radius: 50%;
        animation: none;
      }

      .icon.skipped {
        border-color: var(--status-queued);
        background: var(--status-queued);
        animation: none;
      }

      .icon.beyond {
        width: 8px;
        height: 1.5px;
        border: 0;
        border-radius: 1px;
        background: var(--pending);
        opacity: 0.85;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      aside.workers {
        padding: 0.75rem;
        background: var(--panel);
        overflow: auto;
      }

      .worker-grid {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }

      .worker {
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 0.55rem 0.6rem;
        background: var(--bg);
        box-shadow: inset 3px 0 0 transparent;
      }

      .worker.stale {
        border-color: var(--border);
        opacity: 0.7;
        box-shadow: inset 2px 0 0 var(--status-queued);
        background: var(--bg);
      }

      .worker.stale .state {
        color: var(--muted);
      }

      .worker .top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 0.4rem;
        margin-bottom: 0.2rem;
      }

      .worker .id-row {
        display: flex;
        align-items: center;
        gap: 0.4rem;
        min-width: 0;
      }

      .worker .id {
        font-family: var(--mono);
        font-size: 0.8rem;
        font-weight: 600;
      }

      .worker .state {
        font-size: 0.65rem;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--muted);
      }

      .worker.stale .state {
        color: var(--stale);
      }

      .worker .job {
        font-size: 0.72rem;
        color: var(--text);
      }

      /* Heartbeat lamp: green within lease policy, red when stale;
         `.pulse` fires once when a new heartbeat arrives. */
      .worker .hb {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        flex-shrink: 0;
        background: var(--stale);
        box-shadow: 0 0 0 0 transparent;
      }

      .worker .hb.ok {
        background: var(--accent);
      }

      .worker .hb.pulse.ok {
        animation: hb-pulse-ok 0.55s ease-out;
      }

      .worker .hb.pulse:not(.ok) {
        animation: hb-pulse-bad 0.55s ease-out;
      }

      @keyframes hb-pulse-ok {
        0% {
          transform: scale(1);
          box-shadow: 0 0 0 0 rgba(90, 125, 108, 0.4);
        }
        40% {
          transform: scale(1.55);
          box-shadow: 0 0 0 6px rgba(90, 125, 108, 0);
        }
        100% {
          transform: scale(1);
          box-shadow: 0 0 0 0 transparent;
        }
      }

      @keyframes hb-pulse-bad {
        0% {
          transform: scale(1);
          box-shadow: 0 0 0 0 rgba(176, 122, 122, 0.4);
        }
        40% {
          transform: scale(1.55);
          box-shadow: 0 0 0 6px rgba(176, 122, 122, 0);
        }
        100% {
          transform: scale(1);
          box-shadow: 0 0 0 0 transparent;
        }
      }

      @media (max-width: 900px) {
        .shell {
          grid-template-columns: 1fr;
        }

        .signals-shell {
          grid-template-columns: 1fr;
        }

        main {
          border-right: 0;
        }

        .controls {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Sieve</h1>
      <nav class="tabs" role="tablist" aria-label="Views">
        <button type="button" role="tab" id="tabPlan" aria-selected="true" aria-controls="planShell">
          Plan
        </button>
        <button type="button" role="tab" id="tabSignals" aria-selected="false" aria-controls="signalsShell">
          Signals
        </button>
      </nav>
      <div class="repo" id="repoLabel">…</div>
    </header>

    <div class="shell" id="planShell" role="tabpanel" aria-labelledby="tabPlan">
      <main>
        <div class="controls">
          <div class="knob">
            <label>
              <span>CPU time</span>
              <span id="budgetVal">60s</span>
            </label>
            <input id="budget" type="range" min="5" max="180" value="60" step="5" />
          </div>
          <div class="knob">
            <label>
              <span>Wall time</span>
              <span id="latencyVal">30s</span>
            </label>
            <input id="latency" type="range" min="5" max="120" value="30" step="5" />
          </div>
          <label class="toggle" title="Lower selection rank for tests that both passed and failed on corpus (main) runs">
            <input id="deprioritizeFlakes" type="checkbox" />
            <span>Deprioritize flakes</span>
          </label>
          <label class="toggle" title="Strongly boost tests that failed anywhere in the sieve DB (×10 density)">
            <input id="preferPopular" type="checkbox" />
            <span>Prefer popular failures</span>
          </label>
          <button class="run" id="runBtn" type="button">Run</button>
        </div>

        <div class="tests">
          <ul class="test-list" id="testList"></ul>
        </div>
      </main>

      <aside class="workers">
        <div class="worker-grid" id="workerGrid"></div>
      </aside>
    </div>

    <div class="signals-shell" id="signalsShell" role="tabpanel" aria-labelledby="tabSignals" hidden>
      <section class="signals-col" aria-labelledby="popularHeading">
        <h2 id="popularHeading">
          <span class="popular-star" aria-hidden="true">★</span> Popular failures
          <span class="count" id="popularCount"></span>
        </h2>
        <ul class="signals-list" id="popularList"></ul>
      </section>
      <section class="signals-col" aria-labelledby="flakyHeading">
        <h2 id="flakyHeading">
          <span aria-hidden="true">👻</span> Flaky
          <span class="count" id="flakyCount"></span>
        </h2>
        <ul class="signals-list" id="flakyList"></ul>
      </section>
    </div>

    <script src="/app.js?v=popular-failures1" type="module"></script>
  </body>
</html>
